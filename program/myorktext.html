<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyorkText Editor</title>
    <style>
        :root {
            --toolbar-bg: #f8f9fa;
            --toolbar-border: #dee2e6;
            --button-hover: #e9ecef;
            --code-bg: #111827;
            --code-fg: #e5e7eb;
        }

        body {
            margin: 0;
            font-family: 'Aptos', Arial, sans-serif;
            background: #f5f5f5;
        }

        .toolbar {
            padding: 10px;
            background: var(--toolbar-bg);
            border-bottom: 1px solid var(--toolbar-border);
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .toolbar button, .toolbar select, .toolbar input {
            padding: 6px 12px;
            border: 1px solid #ced4da;
            background: white;
            border-radius: 4px;
            cursor: pointer;
            min-width: 80px;
        }

        .toolbar button:hover {
            background: var(--button-hover);
        }

        .myork-code {
            display: block;
            margin: 14px 0;
            padding: 15px;
            border-radius: 10px;
            background: var(--code-bg);
            color: var(--code-fg);
            border: 1px solid #374151;
            font-family: "Cascadia Code", Consolas, monospace;
            white-space: pre-wrap;
            overflow-x: auto;
        }

        .myork-code::before {
            content: attr(data-language);
            display: block;
            color: #9ca3af;
            font-size: 11px;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: .08em;
        }

        .myork-attachment {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin: 10px 0;
        }

        #editor {
            width: 100%;
            height: 90vh;
            padding: 20px;
            border: none;
            resize: none;
            font-size: 12pt;
            line-height: 1.5;
            outline: none;
        }

        .status-bar {
            padding: 8px;
            background: var(--toolbar-bg);
            border-top: 1px solid var(--toolbar-border);
            display: flex;
            justify-content: space-between;
        }

        .lang-switcher {
            position: fixed;
            top: 10px;
            right: 10px;
        }
    </style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" integrity="sha512-GsLlZN/3F2ErC5ifS5QtgpiJtWd43JWSuIgh7mbzZ8zBps+dvLusv+eNQATqgA/HdeKFVgA5v3S/cIrLF7QnIg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</head>
<body>
    <div class="lang-switcher">
        <select id="language" onchange="changeLanguage(this.value)">
            <option value="tr">Türkçe</option>
            <option value="en">English</option>
        </select>
    </div>

    <div class="toolbar">
        <button data-lang-key="new" onclick="newFile()"></button>
        <button data-lang-key="open" onclick="openFile()"></button>
        <button data-lang-key="save" onclick="saveFile()"></button>
        <button data-lang-key="code" onclick="insertCodeBlock()"></button>
        <button data-lang-key="image" onclick="insertImage()"></button>
        <button data-lang-key="table" onclick="insertTable()"></button>
        <button data-lang-key="link" onclick="insertLink()"></button>
        <button data-lang-key="bullet" onclick="toggleList('unordered')"></button>
        <button data-lang-key="numbered" onclick="toggleList('ordered')"></button>
        <select id="codeLanguage" aria-label="Code language">
            <option value="javascript">JavaScript</option>
            <option value="typescript">TypeScript</option>
            <option value="python">Python</option>
            <option value="html">HTML</option>
            <option value="css">CSS</option>
            <option value="java">Java</option>
            <option value="dart">Dart</option>
            <option value="jsx">React / JSX</option>
            <option value="tsx">React / TSX</option>
            <option value="json">JSON</option>
            <option value="sql">SQL</option>
            <option value="cpp">C++</option>
            <option value="csharp">C#</option>
            <option value="go">Go</option>
            <option value="rust">Rust</option>
            <option value="kotlin">Kotlin</option>
            <option value="swift">Swift</option>
        </select>
        <button data-lang-key="export" onclick="showExportMenu()"></button>
        <button data-lang-key="runCode" onclick="runCodeSnippet()"></button>
        
        <select id="fontFamily" data-lang-key="font" onchange="changeFontFamily(this.value)">
            <option value="Aptos">Aptos</option>
            <option value="Times New Roman">Times New Roman</option>
            <option value="Arial">Arial</option>
        </select>
        
        <select id="fontSize" data-lang-key="size" onchange="changeFontSize(this.value)">
            <option value="2">12</option>
            <option value="4" selected>16</option>
            <option value="5">18</option>
        </select>
        
        <button data-lang-key="bold" onclick="formatText('bold')"><b>K</b></button>
        <button data-lang-key="italic" onclick="formatText('italic')"><i>İ</i></button>
        <button data-lang-key="underline" onclick="formatText('underline')"><u>A</u></button>
        
        <select id="headingStyle" data-lang-key="style" onchange="changeHeadingStyle(this.value)">
            <option data-lang-key="normal">Normal</option>
            <option data-lang-key="heading1">Başlık 1</option>
            <option data-lang-key="heading2">Başlık 2</option>
        </select>
        
        <button data-lang-key="find" onclick="findText()"></button>
        <button data-lang-key="replace" onclick="replaceText()"></button>
        
        <button onclick="alignText('left')">Sol</button>
        <button onclick="alignText('center')">Ortala</button>
        <button onclick="alignText('right')">Sağ</button>
        <button onclick="alignText('justify')">İki Yana Yasla</button>
        
        <input type="color" onchange="changeTextColor(this.value)">
        <input type="color" onchange="changeBackgroundColor(this.value)">
        <div id="exportMenu" style="display:none;gap:6px;align-items:center;">
            <button onclick="exportHTML()">HTML</button>
            <button onclick="exportPDF()">PDF</button>
            <button onclick="exportImage('png')">PNG</button>
            <button onclick="exportImage('jpeg')">JPEG</button>
            <button onclick="exportDOCX()">DOCX</button>
        </div>
    </div>

    <div id="editor" contenteditable="true"></div>

    <div class="status-bar">
        <span data-lang-key="words">Kelime: <span id="wordCount">0</span></span>
        <span><span data-lang-key="page">Sayfa: 1</span> · <span id="autosaveStatus">Auto-save ready</span></span>
    </div>
    <div id="toast" role="status" aria-live="polite" style="position:fixed;left:50%;bottom:22px;transform:translate(-50%,12px);opacity:0;pointer-events:none;z-index:99999;padding:10px 14px;border-radius:10px;background:#111827;color:#fff;transition:opacity .2s,transform .2s;"></div>

    <script>
        // Dil Destek Sistemi
        const translations = {
            tr: {
                new: "Yeni",
                open: "Aç",
                save: "Kaydet",
                font: "Yazı Tipi",
                size: "Boyut",
                bold: "Kalın",
                italic: "İtalik",
                underline: "Altı Çizili",
                style: "Stil",
                normal: "Normal",
                heading1: "Başlık 1",
                heading2: "Başlık 2",
                find: "Bul",
                replace: "Değiştir",
                words: "Kelime",
                page: "Sayfa",
                code: "Kod",
                image: "Görsel",
                table: "Tablo",
                link: "Bağlantı",
                bullet: "Madde",
                numbered: "Numaralı",
                export: "Dışa Aktar",
                runCode: "HTML/JS Çalıştır",
                saveSuccess: "Başarıyla kaydedildi!",
                fileError: "Dosya hatası!"
            },
            en: {
                new: "New",
                open: "Open",
                save: "Save",
                font: "Font",
                size: "Size",
                bold: "Bold",
                italic: "Italic",
                underline: "Underline",
                style: "Style",
                normal: "Normal",
                heading1: "Heading 1",
                heading2: "Heading 2",
                find: "Find",
                replace: "Replace",
                words: "Words",
                page: "Page",
                code: "Code",
                image: "Image",
                table: "Table",
                link: "Link",
                bullet: "Bullets",
                numbered: "Numbered",
                export: "Export",
                runCode: "Run HTML/JS",
                saveSuccess: "Saved successfully!",
                fileError: "File error!"
            }
        };

        let currentLang = navigator.language.startsWith('tr') ? 'tr' : 'en';

        function changeLanguage(lang) {
            currentLang = lang;
            document.querySelectorAll('[data-lang-key]').forEach(el => {
                const key = el.dataset.langKey;
                if (el.tagName === 'OPTION' && el.parentElement.id === 'headingStyle') {
                    el.textContent = translations[lang][el.dataset.langKey];
                } else if (el.tagName === 'BUTTON') {
                    el.textContent = translations[lang][key];
                } else if (el.tagName === 'SPAN') {
                    const parts = el.childNodes;
                    parts[0].textContent = translations[lang][key];
                }
            });
            document.getElementById('language').value = lang;
        }

        // Office-style extensions

        function insertCodeBlock() {
            const language = document.getElementById('codeLanguage').value;
            const code = prompt('Kod bloğunu girin:', '');
            if (code === null) return;

            const safe = code.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            const block = '<pre class="myork-code" data-language="' + language + '" contenteditable="true"><code>' + safe + '</code></pre><p><br></p>';
            document.execCommand('insertHTML', false, block);
            scheduleAutosave();
        }

        function insertImage() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/png,image/jpeg,image/gif,image/webp,image/svg+xml';
            input.onchange = event => {
                const file = event.target.files && event.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = loadEvent => {
                    const img = '<img class="myork-attachment" src="' + loadEvent.target.result + '" alt="' +
                        file.name.replace(/"/g, '&quot;') + '">';
                    document.execCommand('insertHTML', false, img);
                    scheduleAutosave();
                };
                reader.readAsDataURL(file);
            };
            input.click();
        }

        function insertTable() {
            const rows = Math.max(1, Math.min(20, parseInt(prompt('Satır sayısı:', '3') || '0', 10)));
            const cols = Math.max(1, Math.min(12, parseInt(prompt('Sütun sayısı:', '3') || '0', 10)));
            if (!Number.isFinite(rows) || !Number.isFinite(cols)) return;

            let table = '<table style="border-collapse:collapse;width:100%;margin:14px 0;"><tbody>';
            for (let r = 0; r < rows; r++) {
                table += '<tr>';
                for (let c = 0; c < cols; c++) {
                    const tag = r === 0 ? 'th' : 'td';
                    table += '<' + tag + ' contenteditable="true" style="border:1px solid #d1d5db;padding:8px;text-align:left;">' +
                        (r === 0 ? 'Başlık ' + (c + 1) : '') + '</' + tag + '>';
                }
                table += '</tr>';
            }
            table += '</tbody></table><p><br></p>';
            document.execCommand('insertHTML', false, table);
            scheduleAutosave();
        }

        function insertLink() {
            const url = prompt('Bağlantı adresi:', 'https://');
            if (!url) return;
            document.execCommand('createLink', false, url);
            scheduleAutosave();
        }

        function toggleList(type) {
            document.execCommand(type === 'ordered' ? 'insertOrderedList' : 'insertUnorderedList');
            scheduleAutosave();
        }

        function showExportMenu() {
            const menu = document.getElementById('exportMenu');
            menu.style.display = menu.style.display === 'none' ? 'flex' : 'none';
        }

        function downloadBlob(blob, filename) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        function exportHTML() {
            const html = '<!doctype html><html><head><meta charset="utf-8"><title>MyorkText Document</title><style>body{font-family:Arial,sans-serif;max-width:850px;margin:40px auto;padding:0 24px;line-height:1.6}.myork-code{background:#111827;color:#e5e7eb;padding:14px;border-radius:8px;white-space:pre-wrap}</style></head><body>' + editor.innerHTML + '</body></html>';
            downloadBlob(new Blob([html], {type:'text/html;charset=utf-8'}), 'document.html');
        }

        async function exportPDF() {
            if (typeof html2pdf !== 'function') {
                showToast('PDF export library is unavailable.');
                return;
            }
            const clone = editor.cloneNode(true);
            clone.style.width = '850px';
            clone.style.padding = '30px';
            clone.style.background = 'white';
            clone.style.color = 'black';

            const holder = document.createElement('div');
            holder.style.position = 'fixed';
            holder.style.left = '-100000px';
            holder.appendChild(clone);
            document.body.appendChild(holder);

            try {
                await html2pdf().set({
                    margin: 0.45,
                    filename: 'document.pdf',
                    image: {type:'jpeg', quality:0.96},
                    html2canvas: {scale:2, useCORS:true},
                    jsPDF: {unit:'in', format:'a4', orientation:'portrait'}
                }).from(clone).save();
            } finally {
                holder.remove();
            }
        }

        async function exportImage(type) {
            if (typeof html2canvas !== 'function') {
                showToast('Image export library is unavailable.');
                return;
            }

            const canvas = await html2canvas(editor, {backgroundColor:'#ffffff', scale:2, useCORS:true});
            canvas.toBlob(blob => {
                if (blob) downloadBlob(blob, 'document.' + (type === 'jpeg' ? 'jpg' : 'png'));
            }, type === 'jpeg' ? 'image/jpeg' : 'image/png', 0.95);
        }

        async function exportDOCX() {
            try {
                const { Document, Packer, Paragraph, TextRun, HeadingLevel, ImageRun } = await import('https://esm.sh/docx@9.8.1');

                const children = [];
                const root = editor.cloneNode(true);

                async function addNode(node) {
                    if (node.nodeType !== Node.ELEMENT_NODE) return;
                    const tag = node.tagName.toLowerCase();

                    if (/^h[1-6]$/.test(tag)) {
                        children.push(new Paragraph({
                            heading: HeadingLevel['HEADING_' + tag.substring(1)],
                            children: [new TextRun(node.textContent || '')]
                        }));
                        return;
                    }

                    if (tag === 'pre' && node.classList.contains('myork-code')) {
                        children.push(new Paragraph({
                            children: [new TextRun({
                                text: '[' + (node.dataset.language || 'text') + ']\n' + (node.textContent || ''),
                                font: 'Cascadia Code',
                                size: 20
                            })]
                        }));
                        return;
                    }

                    if (tag === 'img' && node.src && node.src.startsWith('data:')) {
                        const match = node.src.match(/^data:(image\/(png|jpeg|jpg|gif));base64,(.+)$/);
                        if (match) {
                            const bytes = Uint8Array.from(atob(match[3]), char => char.charCodeAt(0));
                            children.push(new Paragraph({
                                children: [new ImageRun({
                                    data: bytes,
                                    transformation: {width: 500, height: 300},
                                    type: match[2] === 'jpg' ? 'jpg' : match[2]
                                })]
                            }));
                        }
                        return;
                    }

                    const text = (node.innerText || node.textContent || '').trim();
                    if (text) {
                        children.push(new Paragraph({
                            children: [new TextRun(text)]
                        }));
                    }
                }

                for (const child of root.children) {
                    await addNode(child);
                }

                if (!children.length) {
                    children.push(new Paragraph({children:[new TextRun('')]}));
                }

                const doc = new Document({
                    sections: [{children}]
                });

                const blob = await Packer.toBlob(doc);
                downloadBlob(blob, 'document.docx');
            } catch (error) {
                console.error(error);
                showToast('DOCX export failed. Please check your connection and try again.');
            }
        }

        // Editör Fonksiyonları
        const editor = document.getElementById('editor');
        const AUTOSAVE_KEY = 'myorktext_autosave_v2';
        const autosaveStatus = document.getElementById('autosaveStatus');
        const toast = document.getElementById('toast');
        let autosaveTimer = null;
        let toastTimer = null;
        function showToast(message) {
            toast.textContent = message; toast.style.opacity='1'; toast.style.transform='translate(-50%,0)';
            clearTimeout(toastTimer); toastTimer=setTimeout(()=>{toast.style.opacity='0';toast.style.transform='translate(-50%,12px)';},2200);
        }
        function scheduleAutosave() {
            autosaveStatus.textContent='Saving draft…'; clearTimeout(autosaveTimer);
            autosaveTimer=setTimeout(()=>{try{localStorage.setItem(AUTOSAVE_KEY,JSON.stringify({format:'myorktext',version:2,lang:currentLang,content:editor.innerHTML,savedAt:new Date().toISOString()}));autosaveStatus.textContent='Draft saved';}catch(error){autosaveStatus.textContent='Local save unavailable';}},500);
        }
        function recoverDraft() {
            try { const raw=localStorage.getItem(AUTOSAVE_KEY); if(!raw)return; const draft=JSON.parse(raw); if(!draft||typeof draft.content!=='string')return; editor.innerHTML=draft.content; if(draft.lang&&translations[draft.lang])changeLanguage(draft.lang); autosaveStatus.textContent='Draft recovered'; showToast('Recovered local draft'); } catch(error){autosaveStatus.textContent='Draft unavailable';}
        }
        
        function newFile() {
            if (editor.innerText.trim() && !confirm('Create a new document? Unsaved content in this editor will be replaced.')) return;
            editor.innerHTML = '';
            updateWordCount();
            try { localStorage.removeItem(AUTOSAVE_KEY); } catch (error) {}
            autosaveStatus.textContent = 'New document';
        }

        function openFile() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.myorktxt';
            
            input.onchange = e => {
                const file = e.target.files[0];
                const reader = new FileReader();
                
                reader.onload = function(e) {
                    editor.innerHTML = e.target.result;
                    updateWordCount();
                    scheduleAutosave();
                };
                
                reader.readAsText(file);
            };
            
            input.click();
        }

        function saveFile() {
            const content = editor.innerHTML;
            const blob = new Blob([content], {type: 'text/html;charset=utf-8'});
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.download = `document.myorktxt`;
            a.href = url;
            a.click();
            
            URL.revokeObjectURL(url);
            scheduleAutosave();
            autosaveStatus.textContent = 'Saved to file';
            showToast(translations[currentLang].saveSuccess);
        }

        // Dil Yükleyici
        document.addEventListener('DOMContentLoaded', () => {
            changeLanguage(currentLang);
            recoverDraft();
            updateWordCount();
        });

        document.addEventListener('keydown', event => {
            if (!(event.ctrlKey || event.metaKey)) return;
            const key = event.key.toLowerCase();
            if (key === 's') { event.preventDefault(); saveFile(); }
            else if (key === 'o') { event.preventDefault(); openFile(); }
            else if (key === 'n') { event.preventDefault(); newFile(); }
        });

        // Yeni Fonksiyonlar
        function changeFontFamily(font) {
            document.execCommand('fontName', false, font);
        }

        function changeFontSize(size) {
            document.execCommand('fontSize', false, size);
        }

        function changeHeadingStyle(style) {
            const tag = style === 'heading1' ? 'h1' : style === 'heading2' ? 'h2' : 'p';
            document.execCommand('formatBlock', false, tag);
        }

        function alignText(alignment) {
            const commandMap = {
                left: 'justifyLeft',
                center: 'justifyCenter',
                right: 'justifyRight',
                justify: 'justifyFull'
            };
            document.execCommand(commandMap[alignment]);
        }

        function changeTextColor(color) {
            document.execCommand('foreColor', false, color);
        }

        function changeBackgroundColor(color) {
            document.execCommand('hiliteColor', false, color);
        }


        function runCodeSnippet() {
            const language = document.getElementById('codeLanguage').value;
            if (!['html', 'javascript', 'jsx', 'tsx'].includes(language)) {
                showToast('Browser preview supports HTML and JavaScript. Other languages remain editable code.');
                return;
            }
            const code = prompt('Paste HTML or JavaScript to run in a sandboxed preview:', '');
            if (code === null) return;
            const preview = window.open('', '_blank');
            if (!preview) { showToast('Allow pop-ups to open the preview.'); return; }
            preview.document.open();
            preview.document.write('<!doctype html><html><head><meta charset="utf-8"><title>MyorkText Code Preview</title><style>body{font-family:Arial;padding:20px}pre{white-space:pre-wrap}</style></head><body><h2>MyorkText Preview</h2><p>HTML/JavaScript preview runs in a sandboxed frame.</p><div id="preview-root"></div></body></html>');
            preview.document.close();
            const frame = preview.document.createElement('iframe');
            frame.setAttribute('sandbox', 'allow-scripts');
            frame.style.cssText = 'width:100%;height:75vh;border:1px solid #ccc;border-radius:8px';
            preview.document.body.appendChild(frame);
            const source = language === 'javascript'
                ? '<!doctype html><html><body><div id="app"></div><script>' + code.replace(/<\/script/gi, '<\\/script') + '<\/script></body></html>'
                : code;
            frame.srcdoc = source;
        }

        editor.addEventListener('input', () => {
            updateWordCount();
            scheduleAutosave();
        });

        // Kelime Sayacı
        editor.addEventListener('input', updateWordCount);

        function updateWordCount() {
            const text = editor.innerText.trim();
            const words = text.split(/\s+/).filter(word => word.length > 0);
            document.getElementById('wordCount').textContent = words.length;
        }
    </script>
</body>
</html>
